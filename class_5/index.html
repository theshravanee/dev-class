<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <script

    ></script>
    <script
      crossorigin
      src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"
    ></script>
    <title>Document</title>
    <style>
        body{
            margin:0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: white;
           
        }
         .game{
            position: relative;
            width: 320px;
            height: 480px;
            border: 3px solid black;
            overflow: hidden;
         }
         .box{
            width: 50px;
            height: 50px;
            background: red;
            position: absolute;
         }
         .score{
            position: absolute;
            top: 5px;
            left: 10px;
            font-size: 20px;
            font-weight: bold;
         }
    </style>
  </head>
  <body>
    <div id="root">
    </div>
    <script>
        let score=0;

        function App(){
            function handleClick(e){
                score++;
                document.getElementById("score").innerText = "Score: "+ score;

                const box = e.target;
                box.style.left = Math.random() * (320 - 50) + "px";
                box.style.top = Math.random() * (480 - 50) +"px";
            }

            // what the fn returns
            return React.createElement("div", {className:"game"},
                React.createElement("div",{id:"score", className:"score"}, "Score: 0"),
                React.createElement("div", {className: "box", onClick:handleClick, style: {left:"100px", top:"100px"}})
            )
        }

        // render

        ReactDOM.render(
            React.createElement(App),
            document.querySelector("#root")
        );
