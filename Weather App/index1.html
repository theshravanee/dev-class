<!doctype html>
<html lang="en">
  <head>

    <title>Weather App</title>
    <style>
        *{
            box-sizing: border-box;
            margin: 0%;

        .input-container{
            display: flex;
            justify-content: center;
            align-items: center;
            height: 10vh;
            width: 100vw;

            gap: 1rem;
        }

        }
