<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Weather App</title>
    <style>
        /* ---------- RESET ---------- */
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  font-family: "Inter", system-ui, sans-serif;
}

/* ---------- COLOR VARIABLES ---------- */
:root {
  --bg-main: #FAF9EE;
  --bg-card: rgba(220, 207, 192, 0.65);
  --bg-input: #EEEEEE;
  --accent: #A2AF9B;
  --text-main: #2F3E34;
  --text-muted: #6B7A6F;
}

/* ---------- PAGE ---------- */
body {
  min-height: 100vh;
  background: linear-gradient(
    135deg,
    #FAF9EE 0%,
    #DCCFC0 100%
  );
  display: flex;
  flex-direction: column;
}

/* ---------- HEADER ---------- */
.input-container {
  height: 12vh;
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 1.25rem;
  padding: 1rem;
}

/* ---------- INPUT ---------- */
#input {
  padding: 12px 14px;
  font-size: 15px;
  border-radius: 10px;
  border: none;
  background-color: var(--bg-input);
  width: 220px;
  outline: none;
  transition: box-shadow 0.3s ease, transform 0.2s ease;
}

#input:focus {
  box-shadow: 0 0 0 3px rgba(162, 175, 155, 0.4);
  transform: translateY(-1px);
}

/* ---------- BUTTON ---------- */
#search-button {
  padding: 12px 18px;
  font-size: 15px;
  border-radius: 10px;
  border: none;
  background: var(--accent);
  color: #fff;
  cursor: pointer;
  transition: transform 0.2s ease, box-shadow 0.3s ease;
}

#search-button:hover {
  transform: translateY(-2px);
  box-shadow: 0 6px 16px rgba(0, 0, 0, 0.15);
}

#search-button:active {
  transform: translateY(0);
}

/* ---------- MAIN ---------- */
.weather-container {
  flex: 1;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 2rem;
}

/* ---------- WEATHER CARD ---------- */
.weather-container > div {
  background: var(--bg-card);
  backdrop-filter: blur(12px);
  border-radius: 20px;
  padding: 2rem 2.5rem;
  display: grid;
  grid-template-columns: auto 1fr auto;
  align-items: center;
  gap: 2rem;
  box-shadow: 0 20px 40px rgba(0, 0, 0, 0.15);
  animation: fadeUp 0.6s ease;
  margin-top: 10%;
}

/* ---------- TEMPERATURE ---------- */
.temperature {
  font-size: 3.2rem;
  font-weight: 600;
  color: var(--text-main);
}

/* ---------- LOCATION + TIME ---------- */
.location-data {
  display: flex;
  flex-direction: column;
  gap: 0.35rem;
}

.location {
  font-size: 1.6 rem;
  font-weight: 500;
  color: var(--text-main);
}

.condition-text {
  font-size: 1.15rem;
  font-weight: 500;
}

.time,
.day,
.date {
  font-size: 1.05rem;
}


/* ---------- WEATHER STATUS ---------- */
.weather-status {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 0.5rem;
}

.weather-status img {
  width: 64px;
  animation: float 3s ease-in-out infinite;
}

.condition-text {
  font-size: 0.9rem;
  color: var(--text-main);
}

/* ---------- ANIMATIONS ---------- */
@keyframes fadeUp {
  from {
    opacity: 0;
    transform: translateY(20px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

@keyframes float {
  0% {
    transform: translateY(0);
  }
  50% {
    transform: translateY(-6px);
  }
  100% {
    transform: translateY(0);
  }
}

/* ---------- RESPONSIVE ---------- */
@media (max-width: 600px) {
  .weather-container > div {
    grid-template-columns: 1fr;
    text-align: center;
    gap: 1.5rem;
  }
}
.location-data {
  margin: 5rem;
}

.location {
  font-size: 1.45rem;
}

.time,
.day,
.date {
  font-size: 0.95rem;
}
#input {
  width: 320px;
  height: 48px;
  padding: 0 18px;
  font-size: 24px;
  border-radius: 12px;
  border: none;
  background-color: var(--bg-input);
}
#search-button {
  height: 48px;
  font-size: 18px;
}


    </style>
  </head>
  <body>
    <header>
      <div class="input-container">
        <input type="text" name="" id="input" placeholder="Enter Location" />
        <button id="search-button">Search</button>
      </div>
    </header>
    <main>
      <div class="weather-container">
        <div class="temperature">12.5 °C</div>
        <div class="location-data">
          <div class="location" id="location">Delhi</div>
          <span class="time">9:15</span>
          <span class="day">Friday</span>
          <span class="date">2026-01-30</span>
        </div>
        <div class="weather-status">
          <div class="icon">
            <img
              src="//cdn.weatherapi.com/weather/64x64/night/143.png"
              alt="weather-status-icon"
              id="weather-icon"
            />
          </div>
          <div>
            <div class="condition-text" id="condition-text">Sunny</div>
          </div>
        </div>
      </div>
    </main>

    <script>
      const API_KEY = "1d5187a1f5474d3b89c60606263001";

      // Get DOM elements
      const inputbox = document.getElementById("input");
      const btn = document.getElementById("search-button");
      
      // Weather display elements
      const tempEl = document.querySelector(".temperature");
      const locationEl = document.getElementById("location");
      const timeEl = document.querySelector(".time");
      const dayEl = document.querySelector(".day");
      const dateEl = document.querySelector(".date");
      const conditionEl = document.getElementById("condition-text");
      const iconEl = document.getElementById("weather-icon");

      // Function to format time from "HH:MM" to 12-hour format
      function formatTime(timeStr) {
        const [hours, minutes] = timeStr.split(":");
        let hour = parseInt(hours);
        const ampm = hour >= 12 ? 'PM' : 'AM';
        hour = hour % 12 || 12;
        return `${hour}:${minutes} ${ampm}`;
      }

      // Function to get day name from date string
      function getDayName(dateStr) {
        const days = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];
        const date = new Date(dateStr);
        return days[date.getDay()];
      }

      // Event listener for search button
      btn.addEventListener("click", async () => {
        const city = inputbox.value.trim();
        if (!city) {
          alert("Please enter a city name");
          return;
        }

        try {
          // Show loading state
          tempEl.textContent = "Loading...";
          
          // Make API call
          const response = await fetch(
            `https://api.weatherapi.com/v1/current.json?key=${API_KEY}&q=${encodeURIComponent(city)}`
          );

          const data = await response.json();

          // Check for API errors
          if (data.error) {
            alert(`Error: ${data.error.message}`);
            tempEl.textContent = "Error!";
            return;
          }

          // Update temperature
          tempEl.textContent = `${data.current.temp_c} °C`;
          
          // Update location
          locationEl.textContent = `${data.location.name}, ${data.location.country}`;
          
          // Update time, day, and date
          const [dateStr, timeStr] = data.location.localtime.split(" ");
          timeEl.textContent = formatTime(timeStr);
          dateEl.textContent = dateStr;
          dayEl.textContent = getDayName(dateStr);
          
          // Update weather condition and icon
          conditionEl.textContent = data.current.condition.text;
          iconEl.src = "https:" + data.current.condition.icon;
          iconEl.alt = data.current.condition.text;
          
          // Clear input field
          inputbox.value = "";

        } catch (error) {
          console.error("Error fetching weather:", error);
          tempEl.textContent = "Error!";
          alert("Failed to fetch weather data. Please try again.");
        }
      });

      // Optional: Allow pressing Enter to search
      inputbox.addEventListener("keypress", (event) => {
        if (event.key === "Enter") {
          btn.click();
        }
      });
    </script>
  </body>
</html>
